site_name: feishu-kit
site_description: A modular, async-first Python toolkit for Feishu (Lark) Open Platform
site_url: https://hustwolfzzb.github.io/feishu-kit
repo_url: https://github.com/HustWolfzzb/feishu-kit
repo_name: HustWolfzzb/feishu-kit
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - Wiki: tutorial-wiki.md
      - Drive: tutorial-drive.md
      - Messaging: tutorial-messaging.md
      - Markdown to Feishu: tutorial-md2feishu.md
      - Server: tutorial-server.md
  - CLI: cli-guide.md
  - API Reference: api-reference.md
  - Course Builder:
      - Overview: course/index.md
      - Ch1: 环境准备: course/ch01-setup.md
      - Ch2: 文档骨架: course/ch02-outline.md
      - Ch3: AI 填充内容: course/ch03-fill-content.md
      - Ch4: 内容审查: course/ch04-review.md
      - Ch5: PPT 课件: course/ch05-ppt.md
      - Ch6: 学术引用: course/ch06-enrich.md
      - Ch7: 工作流与FAQ: course/ch07-workflow.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
