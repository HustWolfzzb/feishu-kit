[project]
name = "feishu-kit"
version = "0.1.0"
description = "A modular Python toolkit for Feishu (Lark) Open Platform — reusable API wrappers, modules, and optional FastAPI server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "feishu-kit contributors" }]
keywords = ["feishu", "lark", "sdk", "wiki", "api", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "mistune>=3.0",
    "typer>=0.12.0",
    "rich>=13.0",
]

[project.scripts]
feishu-kit = "feishu_kit.cli:app"

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["feishu_kit*", "server*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["feishu_kit", "server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B027", "B008", "B904"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
